<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess | Professional Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="home-screen" class="overlay">
            <div class="menu-card">
                <h1>CHESS</h1>
                <p>Professional Chess Experience</p>
                <button onclick="startGame('ai')">Play vs Computer</button>
                <button onclick="startGame('local')">2 Player Local</button>
                <div class="settings-preview">
                    <label>Difficulty: 
                        <select id="difficulty">
                            <option value="1">Easy</option>
                            <option value="2" selected>Medium</option>
                            <option value="3">Hard</option>
                        </select>
                    </label>
                </div>
            </div>
        </div>

        <main id="game-container" class="hidden">
            <div class="left-panel">
                <div class="player-info" id="opponent-info">
                    <div class="avatar">🤖</div>
                    <div class="details">
                        <span class="name">Computer</span>
                        <div class="captured-pieces" id="black-captured"></div>
                    </div>
                    <div class="timer" id="black-timer">10:00</div>
                </div>

                <div id="chess-board-wrapper">
                    <div id="board-coordinates-y"></div>
                    <div id="board"></div>
                    <div id="board-coordinates-x"></div>
                </div>

                <div class="player-info" id="player-info">
                    <div class="avatar">👤</div>
                    <div class="details">
                        <span class="name">You</span>
                        <div class="captured-pieces" id="white-captured"></div>
                    </div>
                    <div class="timer" id="white-timer">10:00</div>
                </div>
            </div>

            <div class="right-panel">
                <div class="game-controls">
                    <button id="btn-undo">Undo</button>
                    <button id="btn-resign">Resign</button>
                    <button id="btn-flip">Flip</button>
                    <button id="btn-new">New Game</button>
                </div>
                <div class="move-history">
                    <h3>Move History</h3>
                    <div id="notation-list"></div>
                </div>
                <div class="status-bar" id="game-status">White's Turn</div>
            </div>
        </main>

        <div id="promotion-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Promote Pawn</h3>
                <div class="promotion-options">
                    <div onclick="promote('q')">♛</div>
                    <div onclick="promote('r')">♜</div>
                    <div onclick="promote('b')">♝</div>
                    <div onclick="promote('n')">♞</div>
                </div>
            </div>
        </div>

        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="winner-text">Checkmate!</h2>
                <p id="reason-text">White wins the game.</p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script src="chess-logic.js"></script>
    <script src="ai.js"></script>
    <script src="ui.js"></script>
</body>
</html>
